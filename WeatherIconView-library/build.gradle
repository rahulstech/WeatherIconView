plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace "com.github.pwittchen.weathericonview"
    compileSdk 36

    defaultConfig {
        minSdk 9
        targetSdk 36
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            assets.srcDirs = ['assets']
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            create('weathericonview', MavenPublication) {
                from components.release
                groupId = 'com.github.rahulstech'
                artifactId = 'weathericonview'
                version = android.defaultConfig.versionName
            }
        }
    }
}