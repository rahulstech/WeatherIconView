plugins {
    id 'com.android.application'
}

android {
    namespace "com.github.pwittchen.weathericonview.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.github.pwittchen.weathericonview.app"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation project(':WeatherIconView-library')
}
